name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LC_ALL: C.UTF-8

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq unzip
          python3 -m pip install --disable-pip-version-check PyYAML

      - name: Build all Minecraft profiles and extensions
        run: ./build-all.sh -B -ntp

      - name: Verify release artifacts
        run: |
          test "$(find dist -maxdepth 1 -type f -name 'CraftEngineRecipe-*.jar' | wc -l)" -eq 4
          test "$(find dist/extensions -maxdepth 1 -type f -name 'cer-ext-*.jar' | wc -l)" -eq 8
          for jar in dist/*.jar dist/extensions/*.jar; do
            unzip -tq "$jar" >/dev/null
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CraftEngineRecipe-${{ github.sha }}
          path: |
            dist/*.jar
            dist/extensions/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: CraftEngineRecipe-${{ github.sha }}
          path: release

      - name: Create checksums
        working-directory: release
        run: |
          find . -type f -name '*.jar' -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              release/*.jar \
              release/extensions/*.jar \
              release/SHA256SUMS.txt \
              --clobber
          else
            release_flags=()
            if [[ "$tag" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$tag" \
              release/*.jar \
              release/extensions/*.jar \
              release/SHA256SUMS.txt \
              --title "$tag" \
              --generate-notes \
              "${release_flags[@]}"
          fi
