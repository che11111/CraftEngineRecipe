name: CraftEngineRecipe
version: '${project.version}'
main: dev.che1s.craftenginerecipe.CraftEngineRecipePlugin
api-version: '${mc.api.version}'
authors: [ che1s, nsoer ]
description: Recipe browser for CraftEngine with categories and search
depend: [ CraftEngine ]
softdepend: [ FarmersDelight, KaleidoscopeCookeryPlugin, CustomCrops ]
folia-supported: true
commands:
  cer:
    description: Open the CraftEngineRecipe recipe browser
    usage: /cer [craft|items|manage|open <menu>|search|hand|target|export <source|all>|reload|unapplied|menu|debug]
    aliases: [ cg, browser ]
permissions:
  craftenginerecipe.admin:
    description: 分类管理、未应用分类浏览及管理员命令 / Category management, unapplied-category browsing and admin commands
    default: op
