      exit-craftable-lore: <#79CFC9>右键：退出可合成物品列表</#79CFC9>
    hand:
      name: <#79CFC9>查询主手配方</#79CFC9>
      lore:
      - <#B8C0CC>点击查看如何合成主手物品</#B8C0CC>
      - <#8793A5>与 /cer hand 相同</#8793A5>
    query:
      name: <#79CFC9>查询配方</#79CFC9>
      lore:
      - <#B8C0CC>左键：查询主手物品的配方</#B8C0CC>
      - <#B8C0CC>右键：查询准星方块的配方</#B8C0CC>
    close:
      name: <#E58B8B>关闭菜单</#E58B8B>
      lore:
      - <#B8C0CC>点击关闭物品分类菜单（等同于 ESC）</#B8C0CC>
    glasses:
      name: <#79CFC9>查询目标方块配方</#79CFC9>
      lore:
      - <#B8C0CC>点击查看如何合成视线中的方块</#B8C0CC>
      - <#8793A5>屏幕准星对准所需查询配方的方块</#8793A5>
    info:
      name: <#79CFC9>操作说明</#79CFC9>
      lore:
      - <#B8C0CC>左键物品：查看合成配方</#B8C0CC>
      - <#B8C0CC>右键物品：查看参与合成</#B8C0CC>
      - <#B8C0CC>左键点击页面外：返回上一页</#B8C0CC>
      - <#B8C0CC>右键点击页面外：返回主页面</#B8C0CC>
      - <#B8C0CC></#B8C0CC>
      - <#8793A5>多条配方会自动轮播</#8793A5>
    workstations:
      name: <#D8B278>按合成器浏览</#D8B278>
      lore:
      - <#B8C0CC>点击按工作台、熔炉等类型浏览</#B8C0CC>
      - <#8793A5>仅展示你有权查看的配方产物</#8793A5>
      personalization-lore: <#79CFC9>右键：打开个性化设置</#79CFC9>
# 会给物品lore加上的文字
    # 留空表示不在物品 lore 后追加任何提示。
