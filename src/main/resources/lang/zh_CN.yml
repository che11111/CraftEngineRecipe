# CraftEngineRecipe 语言文件 / Language file
# 文案支持 MiniMessage；{参数} 是消息占位符，<name>/<count> 等是菜单模板占位符。
# Text supports MiniMessage; {arguments} are message placeholders, while <name>/<count> are UI template placeholders.
# 启动或重载时补齐内置语言文件缺失的条目，保留已有文案；其他缺失文案回退英文。
# Startup or reload adds missing bundled-language entries, preserves existing text, and falls back to English for other missing entries.
# 默认文案使用柔和的十六进制配色；配方标题统一使用石墨黑粗体，其他标题保留颜色并加粗，背景图片保持纯白。
# Default text uses a soft hex palette; recipe titles use bold charcoal, other titles retain their colors and become bold, and background images stay pure white.
prefix: '<#79CFC9>[CraftEngineRecipe]</#79CFC9> '
messages:
  no-permission: <#E58B8B>你没有权限执行此操作。</#E58B8B>
  player-only: <#E58B8B>该指令只能由玩家执行。</#E58B8B>
  reload-start: <#E4D397>正在重载，索引构建完成后会通知你。</#E4D397>
  reload-success: <#98C69A>配置、语言与数据索引已重载完成。</#98C69A>
  reload-failed: <#E58B8B>构建失败或请求被新的重载替代，请查看控制台。</#E58B8B>
  update-available: <#98C69A>发现新版本 {latest}（当前 {current}）。</#98C69A> <#79CFC9>{url}</#79CFC9>
  data-not-ready: <#E4D397>数据尚未就绪：{reason}</#E4D397>
  not-ready-reason: 数据正在初始化、重建或上次构建失败，请稍候；仍未就绪时执行 /cer reload 并检查控制台
  category-not-found: <#E58B8B>分类不存在：{id}</#E58B8B>
  hand-empty: <#E4D397>请先在主手拿着要查询合成配方的物品。</#E4D397>
  hand-item-unavailable: <#E58B8B>主手物品未在正式菜单中开放，或被权限、隐藏规则限制。</#E58B8B>
  hand-no-recipe: <#E4D397>未找到制作 {id} 的配方。</#E4D397>
  hand-resolve-failed: <#E58B8B>无法识别主手物品，请查看控制台。</#E58B8B>
  target-block-empty: <#E4D397>请先看向要查询合成配方的方块。</#E4D397>
  target-block-unavailable: <#E58B8B>目标方块未查询到配方</#E58B8B>
  target-block-no-recipe: <#E4D397>未找到制作 {id} 的配方。</#E4D397>
  target-block-resolve-failed: <#E58B8B>无法识别目标方块，请查看控制台。</#E58B8B>
