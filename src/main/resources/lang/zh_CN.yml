    prev-category:
      name: <#E4D397>◀ 上一个</#E4D397>
    next-category:
      name: <#E4D397>下一个 ▶</#E4D397>
  content:
    prev-page:
      name: <#79CFC9>◀ 上一页</#79CFC9>
    next-page:
      name: <#79CFC9>下一页 ▶</#79CFC9>
    back:
      name: <#E58B8B>返回上级</#E58B8B>
    search:
      name: <#D8B278>搜索物品</#D8B278>
      lore:
      - <#B8C0CC>点击输入关键字搜索</#B8C0CC>
