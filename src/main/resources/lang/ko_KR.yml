    此文件列 未进入 카테고리.yml 의 命名 空间 와 사용자 정의 义按钮

    카테고리.yml에 없는 네임스페이스 및 사용자 정의 버튼을 나열합니다.

    将需要的条目复到범주.yml 의 항목 中，调整可见性后 /cer reload

    원하는 항목을 Navigation/categories.yml에 복사하고 가시성을 조정한 다음 /cer reload를 실행합니다.

    已应用 条目는 重载后移除, 其他条目保留원유를 가지고 있습니다.

