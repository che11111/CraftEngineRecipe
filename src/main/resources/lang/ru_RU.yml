headers:
  unapplied: 'CraftEngineRecipe 未应用条目 / Непримененные записи

    Доступ к файлам категории.yml.

    Перечисляет пространства имен и пользовательские кнопки, отсутствующие в категории.yml.

    将需要的条目复制到 категории.yml 的 записей 中，调整可见性后 /cer reload

    Скопируйте нужные записи в файл Navigation/categories.yml, настройте видимость, затем запустите /cer reload.

    已应用的条目在重载后移除, 其他条目保留原有属性

    Примененные записи удаляются при перезагрузке; другие записи сохраняют свои свойства'
