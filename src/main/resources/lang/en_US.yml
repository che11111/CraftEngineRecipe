# CraftEngineRecipe 语言文件 / Language file
# 文案支持 MiniMessage；{参数} 是消息占位符，<name>/<count> 等是菜单模板占位符。
# Text supports MiniMessage; {arguments} are message placeholders, while <name>/<count> are UI template placeholders.
# 启动或重载时补齐内置语言文件缺失的条目，保留已有文案；其他缺失文案回退英文。
# Startup or reload adds missing bundled-language entries, preserves existing text, and falls back to English for other missing entries.
# 默认文案使用柔和的十六进制配色；配方标题统一使用石墨黑粗体，其他标题保留颜色并加粗，背景图片保持纯白。
# Default text uses a soft hex palette; recipe titles use bold charcoal, other titles retain their colors and become bold, and background images stay pure white.
prefix: '<#79CFC9>[CraftEngineRecipe]</#79CFC9> '
messages:
  debug-usage: '<#E4D397>Usage: /cer debug recipes | /cer debug performance [reset]</#E4D397>'
  debug-export-start: '<#E4D397>Capturing all recipes in small batches; the snapshot will be saved asynchronously in the plugin debug folder.</#E4D397>'
  debug-export-busy: '<#E4D397>A recipe export is already running. Please wait.</#E4D397>'
  debug-export-cooldown: '<#E4D397>Please wait {seconds} seconds before exporting again.</#E4D397>'
  debug-export-success: '<#98C69A>Recipes saved: {path} (Bukkit {bukkit}, CraftEngine {native}, CER providers {external}; entry errors {errors}).</#98C69A>'
  debug-export-failed: '<#E58B8B>Recipe export failed: {error}. Check the console; retry after recipe reloads have completed.</#E58B8B>'
  debug-performance-header: '<#79CFC9>Performance statistics ({seconds} seconds since startup or last reset)</#79CFC9>'
  debug-performance-reset: '<#98C69A>Plugin operation timers and counters reset. Caches and server performance statistics are unchanged.</#98C69A>'
  debug-performance-server: '<#B8C0CC>Server TPS (1/5/15 min): {tps}, average MSPT: {mspt}, Folia: {folia}</#B8C0CC>'
  debug-performance-data: '<#B8C0CC>Index ready={ready} generation={generation}; CE items {items}, categories {categories}, recipes {native}; provider recipes {external}, items {externalItems}</#B8C0CC>'
  debug-performance-gauge: '<#B8C0CC>{name}: {value}</#B8C0CC>'
  debug-performance-operation: '<#B8C0CC>{name}: {count} calls, total {total} ms, average {average} ms, max {max} ms</#B8C0CC>'
  debug-performance-empty: '<#8793A5>No operation timings yet. Use the menus and run this command again.</#8793A5>'
  debug-performance-note: '<#8793A5>Timings may be nested and cannot be added into a server CPU percentage. Reset, reproduce the slowdown, then inspect; use spark for call stacks. Global TPS/MSPT may be unavailable on Folia.</#8793A5>'
  update-available: <#98C69A>New version {latest} is available (current {current}).</#98C69A> <#79CFC9>{url}</#79CFC9>
  no-permission: <#E58B8B>You do not have permission to do this.</#E58B8B>
  player-only: <#E58B8B>This command can only be used by a player.</#E58B8B>
  personalization-saved: '<#98C69A>Preferences saved: menu {menu}, restore position: {remember}.</#98C69A>'
  unapplied-updated: '<#98C69A>Updated namespace {namespace} in {file}.</#98C69A>'
  unapplied-update-failed: '<#E58B8B>Namespace {namespace} was not found; {file} was not changed.</#E58B8B>'
  unapplied-permission-required: '<#E58B8B>A permission node is required when visibility is set to permission.</#E58B8B>'
  button-updated: '<#98C69A>Updated the custom button in {file}.</#98C69A>'
  button-update-failed: '<#E58B8B>The custom button no longer exists or {file} could not be saved.</#E58B8B>'
  button-permission-required: '<#E58B8B>A permission node is required when button visibility is permission-based.</#E58B8B>'
  management-saved: '<#98C69A>Management change saved and the menu was refreshed.</#98C69A>'
  management-save-failed: '<#E58B8B>The target entry was not found or the configuration could not be saved.</#E58B8B>'
  management-applied: '<#98C69A>{namespace} was applied to categories.yml. You can continue adjusting its order in the list.</#98C69A>'
  management-moved: '<#98C69A>Display order updated.</#98C69A>'
  management-edge: '<#8793A5>This entry is already at the edge of the list.</#8793A5>'
  management-applied-readonly: '<#E4D397>This namespace is already in categories.yml; edit the active configuration directly.</#E4D397>'
  management-no-category-page: '<#8793A5>Namespace {namespace} has no browsable namespace category page.</#8793A5>'
  index-build-started: '<#E4D397>Detected {plugins}; building the recipe index...</#E4D397>'
  recipe-export-usage: '<#E4D397>Usage: /cer export craftengine|farmersdelight|kaleidoscope|customcrops|all</#E4D397>'
  recipe-export-started: '<#E4D397>Reading source plugins and regenerating recipe files, please wait.</#E4D397>'
  recipe-export-complete: '<#98C69A>Recipe export complete: {sources} sources, {files} files and {recipes} recipes. Failures: {failures}</#98C69A>'
  recipe-export-failed: '<#E58B8B>No recipe source was exported successfully: {failures}</#E58B8B>'
