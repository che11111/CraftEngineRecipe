    的命名空间和自定义按钮

    Listet Namespaces und benutzerdefinierte Schaltflächen auf, die in der Datei „categories.yml“ nicht vorhanden sind

    将需要的条目复制到 Kategorien.yml 的 Einträge 中，调整可见性后 /cer reload

    Kopieren Sie die gewünschten Einträge in navigation/categories.yml, passen Sie die Sichtbarkeit an und führen Sie dann /cer reload aus

    已应用的条目在重载后移除,其他条目保留原有属性

