# CraftEngineRecipe 适配插件开关 / Integration settings
# mode: ask / enabled / disabled
# ask 会在数据就绪后询问在线管理员；enabled 直接导出并建立索引；disabled 停止导出和索引，
# 但不会删除 recipes/<来源>/ 中已经生成的文件。
# ask prompts online administrators; enabled exports and indexes immediately; disabled keeps existing files.
#
# 配方来源适配器位于 plugins/CraftEngineRecipe/extensions/*.jar。
# Source adapters are loaded from plugins/CraftEngineRecipe/extensions/*.jar.
# 分类预设定义由扩展 JAR 的 category-presets.yml 提供。
# Category preset definitions are provided by each extension JAR's category-presets.yml.
# ---------

# 每个扩展 JAR 的 extension.yml -> integration-defaults 提供出厂默认值。
# Factory defaults live under integration-defaults in each extension JAR.
# integrations.<来源> 仅在服主或管理页需要覆盖默认值时写入；不要在此重复内置扩展配置。
# The integrations section is created only for local overrides or administrator choices.

# 扩展 JAR 提供完整分类预设；本文件只保存运行时 mode，或管理员添加的本地覆盖项。
# Extension JARs provide complete presets. This file stores runtime modes and optional local overrides.
# mode：ask 询问 / enabled 自动应用 / disabled 不自动询问或应用。
# authors 可选；只要 pack.yml 中任意一个作者匹配即可，省略时仅按 namespace 匹配。
# 示例 / Example:
# category-presets:
# - id: customcrops
#   mode: ask
#   visibility: player
# ---------
