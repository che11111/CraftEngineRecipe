id: cer_menu_rough
display-name: '<gray>CER 粗糙风格界面'
pages:
  - namespaces
  - workstations

browser:
  # 标题图片、位移和边框由当前菜单包控制；<title> 会替换为 lang/<语言>.yml 中的本地化标题。
  # This menu pack owns the title image, shifts and frame; <title> is replaced by the localized lang/<locale>.yml title.
  title-offset: -8
  title-shift: -168
  title: "<#FFFFFF><shift:<offset>><image:cer_rough:main><shift:<shift>><title>"
  workstations-title: "<#FFFFFF><shift:<offset>><image:cer_rough:main><shift:<shift>><title>"
  search-title: "<#FFFFFF><shift:<offset>><image:cer_rough:main><shift:<shift>><title>"
  disabled-item-model: cer_rough:blank_items
  layout:
    - '<CCCCCCC>'
    - 'XXXXXXXXX'
    - 'XXXXXXXXX'
    - 'XXXXXXXXX'
    - 'XXXXXXXXX'
    - 'BTLHSGRI#'

category-bar:
  source: ce
  list: []
  icon-char: C
  icon-name: '<gray><name>'
  icon-lore: []
  sub-icon-lore: []
  prev-category:
    char: '<'
    item-model: cer_rough:prev
    material: minecraft:arrow
  next-category:
    char: '>'
    item-model: cer_rough:next
    material: minecraft:arrow
  admin-only-hint: '<red>仅管理员可查看'
  no-permission-hint: '<red>无权限查看'

content:
  area-char: X
  prev-page:
    char: L
    item-model: cer_rough:prev
    material: minecraft:spectral_arrow
  next-page:
    char: R
    item-model: cer_rough:next
    material: minecraft:spectral_arrow
  back:
    char: B
    item-model: cer_rough:back
    material: minecraft:barrier
  search:
    char: S
    item-model: cer_rough:blank_items
    material: minecraft:compass
  hand:
    char: H
    item-model: cer_rough:palm_blue_cuff
    material: minecraft:paper
  info:
    char: I
    item-model: cer_rough:info_icon
    material: minecraft:paper
  workstations:
    char: T
    item-model: cer_rough:crafting_table
    material: minecraft:crafting_table
  glasses:
    char: G
    item-model: cer_rough:glasses
    material: minecraft:paper
  empty:
    material: minecraft:barrier
  item-lore: []

sounds:
  change-category: 'UI_BUTTON_CLICK-1-2'
  change-page: minecraft:item.book.page_turn
  click: minecraft:ui.button.click
  back: minecraft:item.book.page_turn
  search: minecraft:ui.toast.in
  query-success: 'UI_BUTTON_CLICK-1-2'
  query-failure: 'BLOCK_NOTE_BLOCK_BASS-1-1'
  open-menu: 'BLOCK_IRON_DOOR_OPEN-1-2'
  close-menu: 'BLOCK_IRON_DOOR_CLOSE-1-2'
