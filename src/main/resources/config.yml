# CraftEngineRecipe - 基于 CraftEngine 的物品分类与配方浏览插件

# CER 自定义配方统一从 recipes 文件夹递归加载 .yml/.yaml；示例为 example/recipes/recipes-example.yml。
# Custom displays load recursively from .yml/.yaml files under recipes; see example/recipes/recipes-example.yml.
sources:
  # 从 CraftEngine 配方管理器导出一次固定产物配方；之后只读取 recipes/craftengine/。
  # Export fixed-result recipes from CraftEngine once, then read only recipes/craftengine/.
  craftengine: true
  # 启用由客户端 JAR 提取的原版合成配方。
  # Enable vanilla crafting recipe fallback data extracted from client JARs.
  minecraft: true
  # 启用由客户端 JAR 提取的“耕地”原版栽培数据。
  # Enable vanilla cultivation data extracted from client JARs.
  minecraft-cultivation: true
  # 启用 CraftEngine 资源包中按命名空间提供的栽培数据。
  # Enable cultivation data provided by CraftEngine namespaces.
  craftengine-cultivation: true
  # 控制 CraftEngine 来源在 recipes/craftengine/ 不存在时导出一次。
  # Controls the one-time CraftEngine export when recipes/craftengine/ is absent.
  # 可选适配插件由下方 integrations.<来源>.export-missing 独立控制。
  # Optional integrations use integrations.<source>.export-missing.
  export-missing: true
  # 控制 CraftEngine 来源是否在插件重载后删除并重新导出 recipes/craftengine/。
  # Controls whether recipes/craftengine/ is refreshed after a plugin reload.
  # 可选适配插件由下方 integrations.<来源>.reexport-on-reload 独立控制。
  # Optional integrations use integrations.<source>.reexport-on-reload.
  # 来源插件缺失或读取失败时保留旧文件。默认 false。
  # Keep old files when a source plugin is missing or cannot be read. Defaults to false.
  reexport-on-reload: false
  # CraftEngine 完成配置/资源包重载后，重新导出 craftengine 配方并刷新本插件索引。
  # Re-export craftengine recipes and refresh this plugin after CraftEngine reloads.
  reexport-craftengine-on-ce-reload: true

# ---------- 适配插件与分类预设 / Integrations and category presets ----------
# 适配插件开关和命名空间预设统一位于 integrations.yml。
# Integration switches and namespace presets are stored together in integrations.yml.

# ---------- 索引构建提示 / Index build notifications ----------
indexing:
  # 数据就绪后向在线管理员发送适配插件启用询问；没有管理员在线时会在其上线后询问。
  # Ask online administrators about detected integrations after data is ready; wait for one to join if needed.
  # 检测到匹配的命名空间预设时先询问管理员；点击“应用预设”后才会写入 categories.yml。
  # Ask administrators about matching namespace presets; write to categories.yml only after approval.
  notify-admins-on-startup: true
  # 通过 CER Recipe API 首次注册、配方数量变化或注销时通知在线管理员。
  # Notify online administrators when an API source registers, changes its recipe count, or unregisters.
  notify-admins-on-api-register: true

# ---------- 配方文件 / Recipe files ----------
recipes:
  # 监听 recipes/ 下 YAML 的修改并自动重载，不再需要手动执行 /cer reload。
  # Watch YAML changes under recipes/ and reload automatically without /cer reload.
  auto-reload: true
  # 异步文件检查间隔（tick，10～200）。连续两次稳定后才异步解析 YAML，并回到全局线程处理 Bukkit 数据与发布索引。
  # Async file check interval (10-200 ticks); YAML is parsed asynchronously after two stable observations, while Bukkit data and index publishing stay on the global thread.
  poll-interval: 20

# ---------- 名称颜色前缀 / Name color prefixes ----------
# 填入 MiniMessage 样式。前缀只作用于名称；标题图片、位移和 Lore 不受影响。
# MiniMessage styles applied to names only; title images, shifts and lore are unaffected.
name-prefixes:
  # CER 页面目录区按钮名称，默认白色。
  # Names in the CER category directory, white by default.
  category-bar: '<white>'
  # 选择物品种类后，标题中的分类名称，默认黑色加粗。
  # Category name inside the page title after selecting a category, bold black by default.
  category-title: '<black><bold>'
  # 合成器页面目录区按钮名称，默认白色。
  # Names in the workstation directory, white by default.
  workstation-bar: '<white>'
  # 选择合成器后，标题中的合成器名称，默认黑色加粗。
  # Workstation name inside the page title after selecting it, bold black by default.
  workstation-title: '<black><bold>'
  # 各合成器配方详情页的标题名称，默认黑色加粗。
  # Recipe-detail page titles for every workstation, bold black by default.
  recipe-title: '<black><bold>'

# CraftEngineRecipe - Recipe browser for CraftEngine
# 启动或 /cer reload 时自动补齐缺失配置与默认值，保留已有配置值。
# Startup or /cer reload adds missing settings and defaults while preserving existing values.

# 全服使用的语言；内置 zh_CN（简体中文）与 en_US（英语）。
# Server-wide language; bundled options: zh_CN (Simplified Chinese), en_US (English).
language: zh_CN

# ---------- 主菜单材质包 / Main menu pack ----------
menu-packs:
  # 玩家执行 /cer 和快捷键时使用的默认样式。
  # Default style used by /cer and the hotkey.
  default: cer_menu_cute
  # 同时安装到 CraftEngine 的样式；默认启用可爱版、粗版、原版材质版和地图版。
  # Menu packs installed into CraftEngine together; cute, rough, vanilla and map are enabled by default.
  # 可填写一个或多个 cer_menu_*；管理员也可用 /cer menu enable all 启用全部。
  # List one or more cer_menu_* packs, or use /cer menu enable all as an administrator.
  enabled:
    - cer_menu_cute
    - cer_menu_rough
    - cer_menu_vanilla
    - cer_menu_map
  # 切换后自动执行的 CraftEngine 重载命令；留空则只重载 CER 配置。
  # CraftEngine command dispatched after changing enabled packs; empty reloads only CER.
  reload-command: ce reload all

# ---------- 玩家个性化 / Player personalization ----------
personalization:
  # 是否允许玩家在菜单中右键“切换工作台”按钮打开个性化页面。
  # Whether players can right-click the workstation toggle button to open personalization.
  enabled: true
  # 玩家可选择的菜单样式；只能选择 menu-packs.enabled 中已启用的样式。
  # Menu styles players can choose; entries must also be enabled under menu-packs.enabled.
  menu-packs:
    - cer_menu_cute
    - cer_menu_rough
    - cer_menu_vanilla
    - cer_menu_map
  # 玩家尚未保存选择时使用的样式。
  # Menu style used until the player saves a choice.
  default-menu-pack: cer_menu_cute
  # 玩家尚未保存设置时，关闭菜单后是否恢复上次浏览位置。
  # Whether an unconfigured player reopens the last browsing position.
  default-remember-last-page: true
# 标题和文本在 lang/<语言>.yml 中修改；布局、按钮、材质和音效在对应 cer_menu_*/menu.yml 中修改。
# Edit text under ui in lang/<language>.yml; layouts, buttons, materials and sounds live in each cer_menu_*/menu.yml.
# 检查更新：启动后及每 6 小时后台检查 GitHub 正式版，发现新版后通知控制台和管理员。
# Check for updates: check GitHub stable releases in the background after startup and every 6 hours; notify console and admins.
# 仅提醒，不自动下载或替换插件；设为 false 后执行 /cer reload 即可关闭。
# Only sends notifications, without downloading or replacing the plugin; set false and run /cer reload to disable.
check-for-updates: true

# 插件会生成 CraftEngine/resources/CraftEngineRecipe/subpacks/ 统一资源包。
# The plugin generates the unified CraftEngine/resources/CraftEngineRecipe/subpacks/ bundle.

# ---------- 主界面 / Main browser ----------
browser:
  # 未恢复上次位置时，/cer 与 Shift+F 默认打开的主页面。
  # Landing page for /cer and Shift+F when no previous position is restored.
  # 可选 namespaces（按物品种类分类）或 workstations（按合成器分类）。
  # Allowed values: namespaces (item-type view) or workstations (workstation view).
  default-main-page: namespaces
  # 玩家直接按 ESC 离开时保存其页面（跨重登与服务器重启）；下次 /cer 或快捷键打开时恢复。
  # Save the current page when the player leaves with ESC (including relog/restart) and resume on the next open.
  remember-last-page: true
  # ESC 记忆有效期（分钟），默认 3 分钟；到期后下一次打开从默认首页开始。
  # ESC position lifetime in minutes (default 3); expired positions open the normal home view.
  remember-last-page-minutes: 3
# ---------- 配方页 / Recipe windows ----------
recipe:
  # 多配方轮播间隔，范围 5～200 tick；正常 TPS 下 20 tick=1 秒。
  # Rotation interval for multiple recipes, 5-200 ticks; 20 ticks=1 second at normal TPS.
  rotate-interval: 30
  # 使用原生配方窗口，点击窗口外返回；物品左键查看配方、右键查看用途。
  # Native recipe windows: click outside to return; left-click items for recipes, right-click for uses.

# ---------- 搜索 / Search ----------
search:
  # 输入长度上限，范围 1～64。
  # Maximum input length, 1-64 characters.
  max-length: 32
  # 结果数量上限，范围 1～1000；物品多时建议保留默认值。
  # Maximum results, 1-1000; keep the default for large item collections.
  max-results: 200
  # 从 CraftEngine 生成的资源包读取物品翻译；靠前的语言优先，后面的语言补齐缺失键。
  # Read item translations from CraftEngine's generated pack; earlier locales win, later ones fill missing keys.
  # 与顶部 language（插件界面语言）无关；生成资源包后执行 /cer reload 刷新搜索索引。
  # Independent of the UI language above; run /cer reload after generating the pack to refresh search indexes.
  languages:
    - zh_cn
    - en_us

# ---------- 快捷键 / Hotkey ----------
hotkey:
  # 是否启用交换副手键打开菜单，默认 Shift+F；无需额外权限。
  # Enable opening with the swap-hands key (Shift+F by default); no extra permission required.
  enabled: true
  # 是否必须潜行；设为 false 会占用普通交换副手操作。
  # Require sneaking; false also intercepts normal swap-hands actions.
  require-sneak: true

# ---------- bStats 统计 / Anonymous bStats metrics ----------
bstats:
  enabled: true
