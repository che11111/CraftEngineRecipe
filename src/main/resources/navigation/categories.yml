# CraftEngineRecipe 配方分类菜单条目（按顺序显示） / Recipe menu entries (display order)
# 命名空间：id + visibility(admin/player/permission) + permission
# Namespace: id + visibility(admin/player/permission) + permission
# 可选：icon-name / item-lore / icon-lore / sub-icon-lore
# Optional: icon-name / item-lore / icon-lore / sub-icon-lore
# 自定义按钮：display + actions，可与命名空间条目混排；按钮不使用 id 字段
# Custom buttons: display + actions; mix freely with namespace entries. Buttons do not use id.
# 未配置的命名空间写入 categories-unapplied.yml；管理员用 /cer manage 在游戏内检查、编辑和应用
# Unconfigured namespaces go to categories-unapplied.yml; admins can review, edit and apply them in /cer manage
# hidden-categories 隐藏分类入口与路径；hidden-items 只隐藏物品 / hidden-categories hides category entries and paths; hidden-items hides only items
# 完整示例见 categories-example.yml / See categories-example.yml for examples

entries:
- id: minecraft
  visibility: player
  permission: ''
  sort-by-namespace: true
  hide-items-without-recipes: true
  icon-name: '<white>原版物品</white>'
  icon-lore:
    - '<gray>点击查看所有原版物品</gray>'
    - '<dark_gray>物品数: <count></dark_gray>'
- id: default
  visibility: player
  permission: ''
  hidden-items:
    - category: default:misc
      items:
        - default:gui_head_size_1
        - default:gui_head_size_4
- display:
    material: minecraft:gray_stained_glass_pane
    name: ''
    lore:
    - '&#B8C0CC一个分隔玻璃板'
  actions:
    all: []
- display:
    material: minecraft:compass
    name: '&#D8B278打开「管理页面」'
    lore:
      - '&#B8C0CC在页面中会显示出当前服务器中CE的内容'
      - '&#B8C0CC管理员需要手动应用这些内容，并可以选择屏蔽，或者排序'
      - ''
      - '&#B8C0CC通过/cer manage指令也可以进入'
      - '&#B8C0CC此按钮仅管理员可见'
      - '&#B8C0CC可以试试将这个按钮隐藏/删掉？'
  visibility: admin
  permission: ''
  hide-inaccessible: true
  actions:
    all:
      - 'sound: UI_BUTTON_CLICK-1-2'
      - close
      - 'delay: 0.1'
      - 'command: cer manage'
- display:
    material: minecraft:compass
    name: '&#D8B278打开「CER的适配插件页面」'
    lore:
      - '&#B8C0CC在页面中会显示当前服务器中有哪些CER特殊适配内容'
      - '&#B8C0CC需要管理员手动开启，适配内容方可工作'
      - ''
      - '&#B8C0CC通过/cer integrations指令也可以进入'
      - '&#B8C0CC此按钮仅管理员可见'
      - '&#B8C0CC可以试试将这个按钮隐藏/删掉？'
  visibility: admin
  permission: ''
  hide-inaccessible: true
  actions:
    all:
      - 'sound: UI_BUTTON_CLICK-1-2'
      - close
      - 'delay: 0.1'
      - 'command: cer integrations'
- display:
    material: minecraft:gray_stained_glass_pane
    name: ''
    lore:
    - '&#B8C0CC一个分隔玻璃板'
  actions:
    all: []