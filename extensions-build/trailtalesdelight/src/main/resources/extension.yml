schema: 1
id: trailandtalesdelight
names:
  en_US: Trail & Tales Delight
  zh_CN: Trail & Tales Delight
  zh_TW: Trail & Tales Delight
  ja_JP: Trail & Tales Delight
  ko_KR: Trail & Tales Delight
  de_DE: Trail & Tales Delight
